    <style><![CDATA[
/* =========================================================
   NEON TUBE MODEL
   Each section animates ONE number, --lit (0 = dead, 1 = fully lit).
   Opacity, glow size, glow strength and core colour are all derived
   from it, so a dip looks like a tube losing power: the glow collapses
   first and the white-hot core cools toward the gas colour.
   ========================================================= */

@property --lit { syntax: "<number>"; inherits: true; initial-value: 1; }  /* per-section flicker */
@property --sag { syntax: "<number>"; inherits: true; initial-value: 1; }  /* whole-sign brownout */
@property --hum { syntax: "<number>"; inherits: true; initial-value: 1; }  /* constant faint shimmer */

#SoftMarmot {
    --glow: 129 140 248;                 /* glow colour as R G B */
    animation:
        hum 2.3s linear infinite,
        brownout 23s linear 3.5s infinite;
}

/* shared look for every tube section (filter lives on 4 groups, not ~25 paths) */
#head, #hand-left, #hand-right, #bottom {
    --p: calc(var(--lit) * var(--sag));
    opacity: calc((0.1 + 0.9 * var(--p)) * var(--hum));
    filter:
        drop-shadow(0 0 calc(1px + 1px * var(--p))  rgb(var(--glow) / calc(0.95 * var(--p))))
        drop-shadow(0 0 calc(2px + 4px * var(--p))  rgb(var(--glow) / calc(0.8  * var(--p))))
        drop-shadow(0 0 calc(4px + 10px * var(--p)) rgb(var(--glow) / calc(0.5  * var(--p))));
}

/* per-section personality: --t0 = when it strikes on, then its own flicker rhythm */
#head       { --t0: 0s;   animation: neon-stable   17s   linear 3.5s infinite; }
#hand-right { --t0: 0.5s; animation: neon-moderate 9.3s  linear 3.5s infinite; }
#hand-left  { --t0: 0.9s; animation: neon-faulty   9s    linear 3.5s infinite; }
#bottom     { --t0: 1.3s; animation: neon-stable   13.1s linear 3.5s infinite; }

/* every path is its own tube segment: white-hot core that tints toward the glow colour when dim */
#SoftMarmot path {
    fill: none;
    stroke: color-mix(in srgb, #fff calc(var(--p) * 100%), rgb(var(--glow))) !important;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: strike 1.4s linear both;
    animation-delay: var(--t0);
}
#SoftMarmot path:nth-of-type(3n+2) { animation-delay: calc(var(--t0) + 0.25s); }
#SoftMarmot path:nth-of-type(3n)   { animation-delay: calc(var(--t0) + 0.5s); }


/* =========================================================
   POWER-ON: each segment stutters on instead of fading in
   ========================================================= */
@keyframes strike {
    0%, 12% { opacity: 0; }
    14%     { opacity: 0.9; }
    18%     { opacity: 0; }
    30%     { opacity: 0; }
    32%     { opacity: 0.6; }
    36%     { opacity: 0.15; }
    40%     { opacity: 0.85; }
    44%     { opacity: 0; }
    60%     { opacity: 0; }
    62%     { opacity: 0.7; }
    66%     { opacity: 0.4; }
    72%, 100% { opacity: 1; }
}


/* =========================================================
   FLICKER PATTERNS
   Dips are 30-200 ms long (a 1-frame blip is invisible).
   Same keyframes + different durations = different rhythms.
   ========================================================= */

/* reliable tube: two short glitches per cycle */
@keyframes neon-stable {
    0%, 41%  { --lit: 1; }
    41.3%    { --lit: 0.3; }
    41.7%    { --lit: 1; }
    42.2%    { --lit: 0.6; }
    42.7%    { --lit: 1; }
    78%      { --lit: 1; }
    78.3%    { --lit: 0.45; }
    78.8%    { --lit: 1; }
    100%     { --lit: 1; }
}

@keyframes neon-moderate {
    0%, 22%  { --lit: 1; }
    22.4%    { --lit: 0.25; }
    23%      { --lit: 1; }
    23.6%    { --lit: 0.5; }
    24.2%    { --lit: 1; }
    64%      { --lit: 1; }
    64.5%    { --lit: 0.4; }
    65.2%    { --lit: 1; }
    100%     { --lit: 1; }
}

/* failing tube: quick stutter, a slow sag, then a dropout with a messy restart */
@keyframes neon-faulty {
    0%, 6%   { --lit: 1; }
    6.4%     { --lit: 0.15; }
    7%       { --lit: 1; }
    7.5%     { --lit: 0.35; }
    8.1%     { --lit: 1; }

    30%      { --lit: 1; }
    30.5%    { --lit: 0.5; }
    32.5%    { --lit: 0.45; }
    33%      { --lit: 1; }

    55%      { --lit: 1; }
    55.4%    { --lit: 0; }
    57.2%    { --lit: 0; }
    57.6%    { --lit: 0.9; }
    58.1%    { --lit: 0.05; }
    58.7%    { --lit: 1; }
    59.5%    { --lit: 0.3; }
    60.1%    { --lit: 1; }
    100%     { --lit: 1; }
}

/* whole sign dips together now and then (shared power supply) */
@keyframes brownout {
    0%, 57%  { --sag: 1; }
    57.3%    { --sag: 0.55; }
    57.7%    { --sag: 1; }
    57.9%    { --sag: 0.8; }
    58.3%    { --sag: 1; }
    100%     { --sag: 1; }
}

/* constant faint shimmer so it never looks perfectly static */
@keyframes hum {
    0%, 100% { --hum: 1; }
    9%       { --hum: 0.95; }
    17%      { --hum: 0.985; }
    34%      { --hum: 0.92; }
    47%      { --hum: 1; }
    63%      { --hum: 0.96; }
    78%      { --hum: 0.985; }
    88%      { --hum: 0.93; }
}


/* =========================================================
   REDUCED MOTION
   ========================================================= */
@media (prefers-reduced-motion: reduce) {
    #SoftMarmot, #SoftMarmot * { animation: none !important; }
}
]]></style>

</svg>
