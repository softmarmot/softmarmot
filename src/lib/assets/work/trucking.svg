<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" overflow="visible" aria-hidden="true">
<defs>
  <filter id="neon-trucking" filterUnits="userSpaceOnUse" x="-20" y="-20" width="200" height="200" color-interpolation-filters="sRGB">
